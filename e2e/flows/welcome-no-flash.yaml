appId: com.socks.hoshino
name: welcome-no-flash
tags:
  - regression
# Regression for the bug fixed alongside v0.1.11: returning users (with a
# hydrated Firebase profile + selected character) briefly painted a frame
# of WelcomeScreen between the splash and the interaction screen, because
# currentView's useState default is 'welcome' and applyProfile only flips
# it to 'interaction' after a server round-trip. The fix is the
# SplashShim that holds a splash-colored layer until profile hydration
# completes.
#
# Maestro can't observe a single-frame flash directly, but it CAN catch
# the regression's user-visible failure mode: landing on Welcome instead
# of Interaction after sign-in. If the shim is broken or the profile
# hydration races, the menu wouldn't be visible and one of WelcomeScreen's
# distinctive labels ("Welcome,", name input, "Get Started", etc.) would
# be on screen instead.
---
- launchApp:
    clearState: true
    stopApp: true
- runFlow: ../setup/sign-in-google.yaml
- extendedWaitUntil:
    visible:
      id: "menu-feed"
    timeout: 30000
- assertNotVisible: "Welcome,"
- assertNotVisible: "Get Started"
- assertVisible:
    id: "menu-feed"
